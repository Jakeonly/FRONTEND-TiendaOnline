<div class="page-head">
  <h1>Detalles de Órdenes</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add_shopping_cart</mat-icon>
    Agregar Producto
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- ID Detalle -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Ref.</th>
        <td mat-cell *matCellDef="let r">
          <small class="uuid-text">#{{ r.id | slice:0:6 }}</small>
        </td>
      </ng-container>

      <!-- ID Orden -->
      <ng-container matColumnDef="orden_id">
        <th mat-header-cell *matHeaderCellDef>Orden</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">{{ r.orden_id | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- ID Producto -->
      <ng-container matColumnDef="producto_id">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let r">
          <div class="product-cell">
            <mat-icon class="mini-icon">inventory_2</mat-icon>
            <span class="uuid-text">{{ r.producto_id | slice:0:8 }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Cantidad -->
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef>Cant.</th>
        <td mat-cell *matCellDef="let r" class="text-center">
          <span class="quantity-badge">{{ r.cantidad }}</span>
        </td>
      </ng-container>

      <!-- Precio Unitario -->
      <ng-container matColumnDef="precio_unitario">
        <th mat-header-cell *matHeaderCellDef>Precio Unit.</th>
        <td mat-cell *matCellDef="let r">
          {{ r.precio_unitario | currency }}
        </td>
      </ng-container>

      <!-- Subtotal -->
      <ng-container matColumnDef="subtotal">
        <th mat-header-cell *matHeaderCellDef>Subtotal</th>
        <td mat-cell *matCellDef="let r">
          <span class="subtotal-text">
            {{ r.subtotal | currency }}
          </span>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
