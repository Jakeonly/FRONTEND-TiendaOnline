<div class="page-head">
  <div class="page-head__title-row">
    <h1>Detalles de Órdenes</h1>
    <button
      mat-icon-button
      type="button"
      class="page-head__search-toggle"
      (click)="toggleSearch()"
      [attr.aria-label]="searchOpen ? 'Cerrar búsqueda' : 'Abrir búsqueda'"
      [attr.aria-expanded]="searchOpen"
    >
      <mat-icon>{{ searchOpen ? 'close' : 'search' }}</mat-icon>
    </button>
    @if (searchOpen) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-head__search-field">
        <mat-label>Buscar...</mat-label>
        <input matInput type="text" (input)="filtrarTabla($event)" />
      </mat-form-field>
    }
  </div>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()" [disabled]="!canManage">
    <mat-icon>add</mat-icon>
    Agregar Producto
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.id) }}</td>
      </ng-container>

      <ng-container matColumnDef="orden_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Orden</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.orden_id) }}</td>
      </ng-container>

      <ng-container matColumnDef="producto_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Producto</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.producto_id) }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cant.</th>
        <td mat-cell *matCellDef="let r">{{ r.cantidad }}</td>
      </ng-container>

      <ng-container matColumnDef="precio_unitario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio Unit.</th>
        <td mat-cell *matCellDef="let r">{{ r.precio_unitario | price }}</td>
      </ng-container>

      <ng-container matColumnDef="subtotal">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Subtotal</th>
        <td mat-cell *matCellDef="let r"><strong>{{ r.subtotal | price }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
