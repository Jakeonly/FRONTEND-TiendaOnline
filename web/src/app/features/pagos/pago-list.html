<div class="page-head">
  <h1>Pagos</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nuevo
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange()">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">ID</th>
        <td mat-cell *matCellDef="let r" class="id-cell">
          <span>{{ shortId(r.id) }}</span>
          <button
            mat-icon-button
            type="button"
            class="copy-button"
            (click)="$event.stopPropagation(); copiarId(r)"
            aria-label="Copiar ID"
            matTooltip="Copiar ID"
          >
            <mat-icon>content_copy</mat-icon>
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="orden_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Orden</th>
        <td mat-cell *matCellDef="let r" class="orden-cell">
          <span>{{ shortId(r.orden_id) }}</span>
          <button
            mat-icon-button
            type="button"
            class="copy-button"
            (click)="$event.stopPropagation(); copiarOrden(r)"
            aria-label="Copiar orden"
            matTooltip="Copiar orden"
          >
            <mat-icon>content_copy</mat-icon>
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="monto">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Monto</th>
        <td mat-cell *matCellDef="let r">{{ r.monto | price }}</td>
      </ng-container>
      <ng-container matColumnDef="metodo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Método</th>
        <td mat-cell *matCellDef="let r">{{ r.metodo }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Estado</th>
        <td mat-cell *matCellDef="let r">{{ r.estado || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Fecha</th>
        <td mat-cell *matCellDef="let r">{{ (r.fecha_edicion || r.fecha_creacion) | date:'short' }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons></mat-paginator>
  </div>
}
