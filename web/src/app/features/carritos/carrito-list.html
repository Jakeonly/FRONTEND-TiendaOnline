<div class="page-head">
  <div class="page-head__title-row">
    <h1>Gestión de Carritos</h1>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-head__search-field">
      <mat-label>Buscar</mat-label>
      <input matInput type="text" (input)="onTextSearch($any($event.target).value)" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-head__date-field">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" (dateChange)="onDateSelected($event.value)" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()" [disabled]="!canManage">
    <mat-icon>add_shopping_cart</mat-icon>
    Nuevo Carrito
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      
      <!-- Columna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Carrito</th>
        <td mat-cell *matCellDef="let r">{{ r.id | slice:0:8 }}</td>
      </ng-container>

      <ng-container matColumnDef="usuario_nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
        <td mat-cell *matCellDef="let r">{{ getUsuarioNombre(r.usuario_id) }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [ngClass]="estadoClass(r.estado)">
            {{ r.estado }}
          </span>
        </td>
      </ng-container>

      <!-- Columna Fecha -->
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha Creación</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_creacion | date:'short' }}</td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
