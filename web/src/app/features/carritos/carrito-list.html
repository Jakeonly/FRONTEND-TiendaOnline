<div class="page-head">
  <h1>Gestión de Carritos</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>shopping_cart</mat-icon>
    Nuevo Carrito
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- ID Carrito -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID Carrito</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">#{{ r.id | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- Usuario (Corregido según interfaz CarritoRead) -->
      <ng-container matColumnDef="usuario_id">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let r">
          <mat-icon class="mini-icon">person</mat-icon>
          {{ r.usuario_id | slice:0:8 }}
        </td>
      </ng-container>

      <!-- Fecha de Creación -->
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Fecha Creación</th>
        <td mat-cell *matCellDef="let r">
          {{ r.fecha_creacion | date:'dd/MM/yyyy HH:mm' }}
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <!-- Sugerencia: Botón para ver detalles del carrito -->
          <button mat-icon-button type="button" (click)="verDetalles(r)" matTooltip="Ver productos">
            <mat-icon>visibility</mat-icon>
          </button>
          
          <button mat-icon-button type="button" (click)="editar(r)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          
          <button mat-icon-button type="button" (click)="eliminar(r)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
