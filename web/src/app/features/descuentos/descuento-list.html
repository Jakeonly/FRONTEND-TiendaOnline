<div class="page-head">
  <h1>Cupones de Descuento</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>local_offer</mat-icon>
    Nuevo Cupón
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
        <td mat-cell *matCellDef="let r"><strong>{{ r.codigo }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="porcentaje">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Porcentaje</th>
        <td mat-cell *matCellDef="let r">{{ r.porcentaje ? r.porcentaje + '%' : '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="monto_fijo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Monto Fijo</th>
        <td mat-cell *matCellDef="let r">{{ r.monto_fijo != null ? (r.monto_fijo | price) : '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_inicio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Desde</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_inicio | date:'shortDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_fin">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Hasta</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_fin | date:'shortDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
