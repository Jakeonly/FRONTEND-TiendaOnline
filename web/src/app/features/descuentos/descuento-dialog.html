<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo Descuento' : 'Editar Descuento' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>Código del Cupón</mat-label>
      <input matInput formControlName="codigo" placeholder="Ej: PROMO2026" />
    </mat-form-field>

    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Porcentaje (%)</mat-label>
      <input matInput type="number" formControlName="porcentaje" />
    </mat-form-field>

    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Monto Fijo</mat-label>
      <input matInput type="number" formControlName="monto_fijo" />
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Fecha Inicio</mat-label>
      <input matInput type="date" formControlName="fecha_inicio" />
    </mat-form-field>

    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Fecha Fin</mat-label>
      <input matInput type="date" formControlName="fecha_fin" />
    </mat-form-field>

  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
