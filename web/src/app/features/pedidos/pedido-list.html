<div class="page-head">
  <h1>Gestión de Pedidos</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add_shopping_cart</mat-icon>
    Nuevo Pedido
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <ng-container matColumnDef="id_pedido">
        <th mat-header-cell *matHeaderCellDef>ID Pedido</th>
        <td mat-cell *matCellDef="let r">#{{ r.id_pedido | slice:0:8 }}</td>
      </ng-container>

      <ng-container matColumnDef="id_usuario">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let r">{{ r.id_usuario | slice:0:8 }}</td>
      </ng-container>

      <ng-container matColumnDef="total_pedido">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let r">{{ r.total_pedido | currency }}</td>
      </ng-container>

      <ng-container matColumnDef="estado_pedido">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [class]="r.estado_pedido">
            {{ r.estado_pedido }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha_pedido">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_pedido | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
