<div class="page-head">
  <h1>Gestión de Pedidos</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add_shopping_cart</mat-icon>
    Nuevo Pedido
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- ID Pedido -->
      <ng-container matColumnDef="id_pedido">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">#{{ r.id_pedido | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- Usuario -->
      <ng-container matColumnDef="id_usuario">
        <th mat-header-cell *matHeaderCellDef>Usuario</th>
        <td mat-cell *matCellDef="let r">
          <mat-icon class="mini-icon">person</mat-icon>
          {{ r.id_usuario | slice:0:8 }}
        </td>
      </ng-container>

      <!-- Total -->
      <ng-container matColumnDef="total_pedido">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let r" class="total-cell">
          {{ r.total_pedido | currency }}
        </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado_pedido">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [ngClass]="r.estado_pedido">
            {{ r.estado_pedido | titlecase }}
          </span>
        </td>
      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="fecha_pedido">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">
          {{ r.fecha_pedido | date:'dd/MM/yyyy HH:mm' }}
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" matTooltip="Editar" (click)="editar(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" matTooltip="Eliminar" (click)="eliminar(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
