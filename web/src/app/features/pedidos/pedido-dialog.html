<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo Pedido' : 'Editar Pedido' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>Usuario que solicita</mat-label>
      <mat-select formControlName="id_usuario">
        @for (u of usuarios(); track u.id) {
          <mat-option [value]="u.id">{{ u.nombre_completo }} ({{ u.email }})</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Dirección de Envío</mat-label>
      <input matInput formControlName="direccion_envio" placeholder="Calle, Carrera, Ciudad..." />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Total del Pedido</mat-label>
      <input matInput type="number" formControlName="total_pedido" />
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado_pedido">
        <mat-option value="procesando">Procesando</mat-option>
        <mat-option value="enviado">Enviado</mat-option>
        <mat-option value="entregado">Entregado</mat-option>
        <mat-option value="cancelado">Cancelado</mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
