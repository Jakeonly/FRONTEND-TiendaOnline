<div class="page-head">
  <div class="page-head__title-row">
    <h1>Gestión de Usuarios</h1>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-head__search-field">
      <mat-label>Buscar...</mat-label>
      <input matInput type="text" (input)="filtrarTabla($event)" />
    </mat-form-field>
  </div>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>person_add</mat-icon>
    Nuevo Usuario
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      
      <!-- Columna Nombre -->
      <ng-container matColumnDef="nombre_completo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let r">
          <strong>{{ r.nombre_completo }}</strong>
        </td>
      </ng-container>

      <!-- Columna Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
        <td mat-cell *matCellDef="let r">{{ r.email }}</td>
      </ng-container>

      <!-- Columna Rol (Admin/User) -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [class.admin]="r.es_admin" [class.user]="!r.es_admin">
            {{ r.es_admin ? 'Administrador' : 'Cliente' }}
          </span>
        </td>
      </ng-container>

      <!-- Columna Estado (Activo/Inactivo) -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [class.activo]="r.activo" [class.inactivo]="!r.activo">
            {{ r.activo ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
