<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo Usuario' : 'Editar Perfil' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Nombre Completo</mat-label>
      <input matInput formControlName="nombre_completo" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="contraseña" [placeholder]="data.mode === 'edit' ? 'Dejar en blanco para no cambiar' : ''" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion" />
    </mat-form-field>

    <div class="span-2 py-8">
      <mat-slide-toggle formControlName="es_admin">Permisos de Administrador</mat-slide-toggle>
    </div>

    @if (data.mode === 'edit') {
      <div class="span-2">
        <mat-slide-toggle formControlName="activo">Usuario Activo</mat-slide-toggle>
      </div>
    }

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
