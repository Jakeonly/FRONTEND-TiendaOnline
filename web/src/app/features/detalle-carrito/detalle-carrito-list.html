<div class="page-head">
  <h1>Detalles de Carrito</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add_shopping_cart</mat-icon>
    Añadir Producto
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let r">{{ r.id | slice:0:8 }}</td>
      </ng-container>

      <ng-container matColumnDef="carrito_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Carrito</th>
        <td mat-cell *matCellDef="let r">{{ r.carrito_id | slice:0:8 }}</td>
      </ng-container>

      <ng-container matColumnDef="producto_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
        <td mat-cell *matCellDef="let r">{{ r.producto_id | slice:0:8 }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Cant.</th>
        <td mat-cell *matCellDef="let r">{{ r.cantidad }}</td>
      </ng-container>

      <ng-container matColumnDef="precio_unitario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio Unit.</th>
        <td mat-cell *matCellDef="let r">{{ r.precio_unitario | price }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
