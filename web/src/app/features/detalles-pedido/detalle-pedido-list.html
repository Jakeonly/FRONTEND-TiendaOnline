<div class="page-head">
  <h1>Detalles de Pedido</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>list_alt</mat-icon> 
    Agregar Detalle
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- Nombre/Etiqueta -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre / Ítem</th>
        <td mat-cell *matCellDef="let r">
          <div class="item-info">
            <span class="main-text">{{ r.nombre }}</span>
            @if (r.descripcion) {
              <small class="sub-text">{{ r.descripcion }}</small>
            }
          </div>
        </td>
      </ng-container>

      <!-- Pedido -->
      <ng-container matColumnDef="id_pedido">
        <th mat-header-cell *matHeaderCellDef>Pedido</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">#{{ r.id_pedido | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- Producto -->
      <ng-container matColumnDef="id_producto">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">{{ r.id_producto | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [ngClass]="r.estado">
            {{ r.estado || 'Sin estado' | titlecase }}
          </span>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
