<div class="page-head">
  <h1>Gestión de Categorías</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>category</mat-icon>
    Nueva Categoría
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">#{{ r.id | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- Nombre y Descripción -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let r">
          <div class="category-info">
            <strong>{{ r.nombre }}</strong>
            @if (r.descripcion) {
              <br>
              <small class="text-muted">{{ r.descripcion }}</small>
            }
          </div>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" matTooltip="Editar categoría">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" matTooltip="Eliminar categoría">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
