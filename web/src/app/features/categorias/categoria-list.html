<div class="page-head">
  <div class="page-head__title-row">
    <h1>Categorías</h1>
    <button
      mat-icon-button
      type="button"
      class="page-head__search-toggle"
      (click)="toggleSearch()"
      [attr.aria-label]="searchOpen ? 'Cerrar búsqueda' : 'Abrir búsqueda'"
      [attr.aria-expanded]="searchOpen"
    >
      <mat-icon>{{ searchOpen ? 'close' : 'search' }}</mat-icon>
    </button>
    @if (searchOpen) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-head__search-field">
        <mat-label>Buscar...</mat-label>
        <input matInput type="text" (input)="filtrarTabla($event)" />
      </mat-form-field>
    }

    <button
      mat-icon-button
      type="button"
      class="page-head__search-toggle"
      (click)="toggleDateSearch()"
      [attr.aria-label]="dateSearchOpen ? 'Cerrar filtro por fecha' : 'Abrir filtro por fecha'"
      [attr.aria-expanded]="dateSearchOpen"
    >
      <mat-icon>{{ dateSearchOpen ? 'close' : 'calendar_today' }}</mat-icon>
    </button>
    @if (dateSearchOpen) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="page-head__search-field">
        <mat-label>Fecha</mat-label>
        <input matInput type="date" (input)="filtrarFecha($event)" />
      </mat-form-field>
    }
  </div>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()" [disabled]="!canManage">
    <mat-icon>add</mat-icon>
    Nueva
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let r">{{ r.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
        <td mat-cell *matCellDef="let r">{{ r.descripcion || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">{{ r.estado ? 'Activa' : 'Inactiva' }}</td>
      </ng-container>
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Creado</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_creacion ? (r.fecha_creacion | date:'dd/MM/yyyy') : '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
