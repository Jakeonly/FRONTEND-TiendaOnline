<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva categoría' : 'Editar categoría' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Nombre de la categoría" />
    </mat-form-field>
    
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="3" formControlName="descripcion" placeholder="Opcional..."></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
