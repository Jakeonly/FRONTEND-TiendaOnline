<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Tienda Online ITM</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- Formulario único: Directo a la autenticación real -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">

        <div *ngIf="errorMessage" class="error-banner" role="alert">
          {{ errorMessage }}
        </div>
        
        <mat-form-field appearance="outline" class="full">
          <mat-label>Correo Electrónico</mat-label>
          <input matInput formControlName="correo_electronico" type="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
          >
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <!-- Spinner solo si estamos procesando el login -->
        <div *ngIf="isSubmitting" class="center">
          <mat-spinner diameter="30" />
        </div>

        <button *ngIf="!isSubmitting" mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="loginForm.invalid">
          Ingresar
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
