<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva orden' : 'Editar orden' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    
    <!-- Usuario ID (UUID) -->
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>ID del Usuario (Comprador)</mat-label>
      <input matInput formControlName="usuario_id" placeholder="Ingrese el UUID del usuario" />
      <mat-icon matSuffix>person</mat-icon>
    </mat-form-field>

    <!-- Total de la Orden -->
    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Total</mat-label>
      <input matInput type="number" formControlName="total" />
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <!-- Estado de la Orden -->
    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado">
        <mat-option value="pendiente">Pendiente</mat-option>
        <mat-option value="pagado">Pagado</mat-option>
        <mat-option value="cancelado">Cancelado</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Descuento ID (Opcional) -->
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>ID de Descuento (Opcional)</mat-label>
      <input matInput formControlName="descuento_id" placeholder="UUID del cupón si aplica" />
      <mat-hint>Si no hay descuento, dejar vacío</mat-hint>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">
    Guardar
  </button>
</mat-dialog-actions>
