<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva orden' : 'Editar orden' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    
    <!-- Usuario -->
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>Usuario comprador</mat-label>
      <mat-select formControlName="usuario_id">
        <mat-option *ngFor="let usuario of usuarios" [value]="usuario.id">
          {{ usuario.nombre_completo }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Total de la Orden -->
    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Total</mat-label>
      <input matInput type="number" min="0" formControlName="total" />
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <!-- Estado de la Orden -->
    <mat-form-field style="padding-top: 1%;" appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado">
        <mat-option value="pendiente">Pendiente</mat-option>
        <mat-option value="pagado">Pagado</mat-option>
        <mat-option value="cancelado">Cancelado</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Cupón por código exacto -->
    <mat-form-field style="padding-top: 1%;" appearance="outline" class="span-2">
      <mat-label>Código del cupón (Opcional)</mat-label>
      <input matInput formControlName="descuento_codigo" placeholder="Ingrese el código exacto del cupón" />
      <button mat-button matSuffix type="button" (click)="verificarCupon()">Verificar</button>
      <mat-hint>Si no hay cupón, dejar vacío</mat-hint>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">
    Guardar
  </button>
</mat-dialog-actions>
