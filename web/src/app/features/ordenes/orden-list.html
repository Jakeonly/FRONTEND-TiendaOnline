<div class="page-head">
  <h1>Gestión de Órdenes</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()" [disabled]="!canManage">
    <mat-icon>add</mat-icon>
    Nueva Orden
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      
      <!-- ID Column (UUID corto como el profe) -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">ID Orden</th>
        <td mat-cell *matCellDef="let r" class="id-cell">
          <span>{{ shortId(r.id) }}</span>
          <button
            mat-icon-button
            type="button"
            class="copy-button"
            (click)="$event.stopPropagation(); copiarId(r)"
            aria-label="Copiar ID de orden"
            matTooltip="Copiar ID de orden"
          >
            <mat-icon>content_copy</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Usuario Column -->
      <ng-container matColumnDef="usuario_nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Usuario</th>
        <td mat-cell *matCellDef="let r">{{ getUsuarioNombre(r.usuario_id) }}</td>
      </ng-container>

      <!-- Total Column -->
      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Total</th>
        <td mat-cell *matCellDef="let r">{{ r.total | price }}</td>
      </ng-container>

      <!-- Estado Column -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [ngClass]="estadoClass(r.estado)">
            {{ estadoLabel(r.estado) }}
          </span>
        </td>
      </ng-container>

      <!-- Fecha Column -->
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header start="desc">Fecha</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_creacion | date:'short' }}</td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 5, 25]" showFirstLastButtons />
  </div>
}
