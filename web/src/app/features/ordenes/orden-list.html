<div class="page-head">
  <h1>Gestión de Órdenes</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>receipt</mat-icon>
    Nueva Orden
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- ID Orden -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID Orden</th>
        <td mat-cell *matCellDef="let r">
          <span class="uuid-text">#{{ r.id | slice:0:8 }}</span>
        </td>
      </ng-container>

      <!-- ID Usuario -->
      <ng-container matColumnDef="usuario_id">
        <th mat-header-cell *matHeaderCellDef>Cliente (ID)</th>
        <td mat-cell *matCellDef="let r">
          <mat-icon class="mini-icon" style="font-size: 16px; vertical-align: middle;">person</mat-icon>
          {{ r.usuario_id | slice:0:8 }}
        </td>
      </ng-container>

      <!-- Total -->
      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let r" class="amount-cell">
          {{ r.total | currency }}
        </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let r">
          <span class="status-badge" [ngClass]="r.estado">
            {{ r.estado | titlecase }}
          </span>
        </td>
      </ng-container>

      <!-- Fecha de Creación (Agregada para utilidad) -->
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">
          {{ r.fecha_creacion | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
