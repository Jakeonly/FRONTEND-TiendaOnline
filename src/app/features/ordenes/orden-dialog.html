<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva Orden' : 'Editar Orden' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Usuario (UUID)</mat-label>
      <input matInput formControlName="usuario_id" placeholder="Ingrese el UUID del cliente" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Descuento (UUID)</mat-label>
      <input matInput formControlName="descuento_id" placeholder="Ingrese el UUID del descuento" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Total ($)</mat-label>
      <input matInput type="number" formControlName="total" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="estado">
        <mat-option value="pendiente">Pendiente</mat-option>
        <mat-option value="pagado">Pagado</mat-option>
        <mat-option value="enviado">Enviado</mat-option>
        <mat-option value="cancelado">Cancelado</mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar Orden</button>
</mat-dialog-actions>
